[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.115",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]
description = "A backend project - Smart E-commerce Customer Support Agent (LangGraph)"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
