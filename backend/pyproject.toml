[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.115",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]
description = "A backend project - Smart E-commerce Customer Support Agent (LangGraph)"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app_reference", "alembic/versions"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
