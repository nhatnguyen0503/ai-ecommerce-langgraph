server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same security headers as the API (see SECURITY.md)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # API: same origin for the browser, forwarded to the backend container.
    # The trailing "/" in proxy_pass strips the /api prefix: /api/orders -> /orders
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown paths (e.g. /admin after F5) return index.html,
    # and React Router decides what to show.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}